[pytest]
addopts = --cov=discount_analyst --cov-branch --cov-report=term-missing -vv
asyncio_mode = auto
testpaths = backend/tests
pythonpath = .
markers =
    yfinance: mark a test as using the yfinance SDK.
    docker: mark a test that requires a local Docker daemon (optional integration).
    network: mark a test that calls a public network API (skip-on-failure inside the test).
